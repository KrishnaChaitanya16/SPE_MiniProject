name: calculator-devops

services:
  calculator:
    build: .
    image: krishnachaitanya1605/calculator-api:${IMAGE_TAG:-latest}
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: default
      JAVA_TOOL_OPTIONS: -Xmx256m
    deploy:
      replicas: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - calc-net

  nginx:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - calc-net

networks:
  calc-net:
    name: calc-net
    driver: bridge
