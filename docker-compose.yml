services:
  calculator:
    build: .
    image: krishnachaitanya1605/calculator-api:${IMAGE_TAG:-latest}
    expose:
      - "8080"
    networks:
      - calc-net

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - calculator
    networks:
      - calc-net

networks:
  calc-net:
    name: calc-net
    driver: bridge
