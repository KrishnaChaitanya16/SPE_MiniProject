# Log which replica served each request
log_format upstreamlog '$remote_addr -> $upstream_addr "$request" $status';

server {
    listen 80;
    access_log /var/log/nginx/access.log upstreamlog;

    # Docker's embedded DNS. A short TTL means replica changes are picked up
    # without restarting nginx.
    resolver 127.0.0.11 valid=5s;

    location / {
        # Using a variable makes nginx resolve "calculator" per request and
        # rotate across every replica address that Docker DNS returns.
        set $calculator_upstream http://calculator:8080;
        proxy_pass $calculator_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
